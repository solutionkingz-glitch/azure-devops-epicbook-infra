trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/*
      - azure-pipelines.yml

pool:
  name: SelfHostedPool-Azure

variables:
  - group: epicbook-db-secrets
  - name: serviceConnection
    value: azure-epicbook-connection
  - name: tfDir
    value: $(System.DefaultWorkingDirectory)/terraform
  - name: allowed_ssh_cidrs
    value: '["102.91.105.7/32"]'
  - name: ssh_public_key
    value: 'PASTE_YOUR_PUBLIC_KEY_HERE'

stages:
  - stage: Validate
    jobs:
      - job: validate
        steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: Terraform init, fmt, validate
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                terraform version
                terraform init -input=false
                terraform fmt -check -recursive
                terraform validate
              workingDirectory: $(tfDir)

  - stage: Plan
    dependsOn: Validate
    jobs:
      - job: plan
        steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: Terraform plan
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                export TF_VAR_mysql_admin_username="$(mysql_admin_username)"
                export TF_VAR_mysql_admin_password="$(mysql_admin_password)"
                export TF_VAR_allowed_ssh_cidrs='$(allowed_ssh_cidrs)'
                export TF_VAR_ssh_public_key="$(ssh_public_key)"
                terraform init -input=false
                terraform plan -input=false -out=tfplan
                terraform show -no-color tfplan > plan.txt
              workingDirectory: $(tfDir)
          - script: cat plan.txt
            displayName: Show plan for review
            workingDirectory: $(tfDir)
          - publish: $(tfDir)/tfplan
            artifact: tfplan

  - stage: Apply
    dependsOn: Plan
    jobs:
      - deployment: apply
        environment: epicbook-infra-prod
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: tfplan
                - task: AzureCLI@2
                  displayName: Terraform apply (reviewed plan)
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_CLIENT_SECRET=$servicePrincipalKey
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                      terraform init -input=false
                      terraform apply -input=false $(Pipeline.Workspace)/tfplan/tfplan
                    workingDirectory: $(System.DefaultWorkingDirectory)/terraform

  - stage: Outputs
    dependsOn: Apply
    jobs:
      - job: outputs
        steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: Show non-sensitive outputs
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                terraform init -input=false
                echo "app_public_ip        = $(terraform output -raw app_public_ip)"
                echo "backend_ansible_host = $(terraform output -raw backend_ansible_host)"
                echo "backend_private_ip   = $(terraform output -raw backend_private_ip)"
                echo "mysql_fqdn           = $(terraform output -raw mysql_fqdn)"
              workingDirectory: $(tfDir)
